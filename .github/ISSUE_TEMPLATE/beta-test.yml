name: Beta Test / Teste Beta
description: Tell us how installation and your first Project Audit went / Conte como foi a instalação e a primeira auditoria.
title: "[Beta Test] "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por testar / Thanks for testing Context Hygiene!
        Este relato é público e ligado à sua conta GitHub. Não inclua segredos, código privado, nomes/caminhos de projetos, URLs privadas ou transcrições completas.
        This report is public and linked to your GitHub account. Omit secrets, private code, project names/paths, private URLs and full transcripts. Metrics are optional; never include them without reviewing them first.
  - type: dropdown
    id: platform
    attributes:
      label: Coding agent / Plataforma
      options:
        - Codex
        - Google Antigravity
        - OpenCode (experimental)
        - Claude Code
        - Cursor
        - Multiple / Vários agentes
        - Other / Outro
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and interface / Versões e interface
      description: Context Hygiene version or commit, agent version and CLI/IDE/Desktop. No private identifiers.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Bootstrap prompt language / Idioma do prompt
      options:
        - Português
        - English
        - No bootstrap / Sem bootstrap
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation / Instalação
      options:
        - Installed and loaded / Instalou e carregou
        - Existing copy reused / Cópia existente reutilizada
        - Files copied but skill not loaded / Arquivos copiados, skill não carregada
        - New session required / Exigiu nova sessão
        - Blocked by permission or network / Bloqueada por permissão ou rede
        - Existing installation conflict / Conflito com instalação existente
        - Failed / Falhou
        - Conversational mode only / Somente modo conversacional
    validations:
      required: true
  - type: dropdown
    id: audit
    attributes:
      label: First Project Audit / Primeira auditoria
      options:
        - Finished with report / Terminou com relatório
        - Started but incomplete / Começou, mas ficou incompleta
        - Did not start / Não começou
        - No change recommended / Nenhuma mudança recomendada
    validations:
      required: true
  - type: dropdown
    id: usefulness
    attributes:
      label: Was it useful? / Foi útil?
      options:
        - Yes / Sim
        - Partially / Parcialmente
        - No / Não
        - Not evaluated / Não avaliado
  - type: textarea
    id: experience
    attributes:
      label: What happened? / O que aconteceu?
      description: Describe what worked, what confused you, expected behavior and any optional action taken without permission. Use redacted examples only.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Optional results / Resultados opcionais
      description: Keep/revert/pending and capability test passed/failed/not tested. If you opt to share reviewed metrics, include only the allowed numerical payload. No logs or screenshots containing private information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / Antes de enviar
      options:
        - label: I reviewed this public report and removed sensitive data / Revisei este relato público e removi dados sensíveis.
          required: true
